site_name: YC 创业手册 · AI Agent 创始人版
site_description: 从 80 支 Y Combinator 视频综合的中英双语创业教程(AI Agent 创始人向)
theme:
  name: material
  language: zh
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep orange
    accent: orange
    toggle:
      icon: material/weather-night
      name: 切换到深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep orange
    accent: orange
    toggle:
      icon: material/weather-sunny
      name: 切换到浅色模式
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.top
  - navigation.indexes
  - navigation.footer
  - search.highlight
  - search.suggest
  - content.code.copy
  - toc.follow
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.tasklist:
    custom_checkbox: true
plugins:
- search: {}
nav:
- 首页 Home: index.md
